apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: recycling-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend

          image: boqnbabanin/recycling-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Read by next.config.ts at server start, not inlined at build time,
            # so this image can be pointed at any backend. Cluster-internal DNS
            # is correct here because the Next server makes this call, not the
            # browser.
            - name: BACKEND_ORIGIN
              value: http://backend:4000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
