apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single source of truth for image tags. The manifests reference the images
# without a tag, so this applies to every container and initContainer at once
# and they cannot drift apart. CI rewrites the newTag lines below.
images:
  - name: boqnbabanin/recycling-backend
    newTag: fe79058baa6cc675ea8532a37060e400b57bf2f8
  - name: boqnbabanin/recycling-frontend
    newTag: fe79058baa6cc675ea8532a37060e400b57bf2f8

resources:
  - namespace.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/backup-pvc.yaml
  - postgres/backup-cronjob.yaml
  - postgres/network-policy.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/servicemonitor.yaml
  - backend/hpa.yaml
  - backend/alerts.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml
  - disruption-budgets.yaml
