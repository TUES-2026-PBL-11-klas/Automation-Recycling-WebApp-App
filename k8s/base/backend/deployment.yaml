apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: recycling-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      # migrate deploy is idempotent, so running it on every rollout is safe and
      # keeps the schema in step with the image being deployed. A failure here
      # (database not up yet) retries with backoff and blocks the app starting
      # against a schema it does not match.
      initContainers:
        - name: migrate
          image: boqnbabanin/recycling-backend:6e460305837f8e1bd630a79025faaa0c4e191f04
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: backend

          image: boqnbabanin/recycling-backend:6e460305837f8e1bd630a79025faaa0c4e191f04
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            # Optional: without it the app still starts, but pickup
            # confirmation emails are skipped and only logged.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: resend-api-key
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
