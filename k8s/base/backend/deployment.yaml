apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: recycling-app
spec:
  # Two replicas so a deploy or a node problem is not a full outage. The app is
  # stateless and has a readiness probe, so the rolling update never routes to a
  # pod that is not ready.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # migrate deploy is idempotent, so running it on every rollout is safe and
      # keeps the schema in step with the image being deployed. A failure here
      # (database not up yet) retries with backoff and blocks the app starting
      # against a schema it does not match.
      initContainers:
        - name: migrate
          image: boqnbabanin/recycling-backend
          imagePullPolicy: IfNotPresent
          # Direct binary, not npx — the production image no longer ships npm.
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        # Runs the compiled seed rather than `prisma db seed`, which needs the
        # prisma.seed config from package.json — not shipped in the runtime
        # image. The script skips districts when any exist and upserts the
        # electronics catalogue, so repeat runs leave existing data alone.
        - name: seed
          image: boqnbabanin/recycling-backend
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/prisma/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: boqnbabanin/recycling-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            # Without this the logger falls back to the pino-pretty dev
            # transport, which is a devDependency and does not exist in the
            # production image — the app throws on startup trying to load it.
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            # Optional: without it the app still starts, but pickup
            # confirmation emails are skipped and only logged.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: resend-api-key
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
