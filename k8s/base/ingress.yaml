apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recycling-ingress
  namespace: recycling-app
spec:
  # The cluster runs ingress-nginx. The old kubernetes.io/ingress.class
  # annotation named traefik, a k3s default that is not installed here, so no
  # controller claimed the Ingress and it never got an address.
  ingressClassName: nginx
  rules:
    - host: recycling.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
